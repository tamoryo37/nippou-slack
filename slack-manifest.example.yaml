_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: にっぽうにぎり
  description: TogglとGoogle Calendarから日報をにぎり、本人確認後にdailyへ投稿します
  background_color: "#D94A2E"

features:
  bot_user:
    display_name: にっぽうにぎり
    always_online: false
  slash_commands:
    - command: /nippou
      url: https://nippou-slack.vercel.app/slack/events
      description: 日報を作成・送信
      usage_hint: "[YYYY-MM-DD]"
      should_escape: false

oauth_config:
  redirect_urls:
    - https://nippou-slack.vercel.app/slack/oauth_redirect
  scopes:
    bot:
      - commands
      - chat:write
    user:
      - chat:write

settings:
  interactivity:
    is_enabled: true
    request_url: https://nippou-slack.vercel.app/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
