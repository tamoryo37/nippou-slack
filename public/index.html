<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>にっぽうにぎり</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f5f8; color: #1d1c1d; }
    main { max-width: 680px; margin: 10vh auto; padding: 0 24px; }
    section { background: #fff; border: 1px solid #e6e3e8; border-radius: 18px; padding: 32px; box-shadow: 0 12px 32px rgba(29, 28, 29, .07); }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { line-height: 1.7; color: #5b565d; }
    code { background: #f1eef3; border-radius: 6px; padding: 2px 6px; }
    a { color: #d94a2e; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; color: #126c3a; font-weight: 650; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #2eb67d; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="status"><span class="dot"></span>Vercelで稼働中</div>
      <h1>にっぽうにぎり</h1>
      <p>TogglとGoogle CalendarからClaudeで日報の下書きを作り、Slack上で「ひとこと」を入力して投稿するアプリです。</p>
      <p>管理者向け: <a href="/healthz">設定状態を確認</a></p>
      <p>Slackの設定後は <code>/slack/install</code> からWorkspaceへインストールします。</p>
    </section>
  </main>
</body>
</html>
